
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - ::1

logger:
  default: info
  logs:
    homeassistant.components.command_line: debug

command_line:
  - sensor:
      unique_id: hourly_assistant
      name: Hourly Assistant
      command: >
        curl -s http://localhost:11434/api/chat -d '{
          "model": "qwen2.5:3b",
          "messages": [{"role": "user", "content": "Please tell me a beautiful little story of maximum 50 words. There is a strict limit, so the story must be under 50 words. Thank you."}],
          "stream": false
        }' | jq -r .message.content
      command_timeout: 120
      scan_interval: 3600
